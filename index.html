<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HTTP Client</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 600px; margin: 0 auto; padding: 20px; }
    select, input, textarea, button { width: 100%; padding: 8px; margin: 5px 0; box-sizing: border-box; }
    textarea { height: 100px; }
    pre { background: #f4f4f4; padding: 10px; overflow-x: auto; }
    .error { color: red; }
  </style>
</head>
<body>
  <h1>HTTP Library Project</h1>
  
  <select id="method">
    <option>GET</option>
    <option>POST</option>
    <option>PUT</option>
    <option>DELETE</option>
    <option>PATCH</option>
  </select>
  
  <input id="endpoint" placeholder="Endpoint" value="/posts/1">
  <input id="params" placeholder='Params (e.g. {"id":1})' value='{"id":1}'>
  <input id="query" placeholder='Query (e.g. {"userId":1})'>
  <textarea id="body" placeholder='Body (e.g. {"title":"Hello"})'>{"title":"Test Post","body":"This is a test","userId":1}</textarea>
  
  <button id="sendButton">Send Request</button>
  
  <h3>Response:</h3>
  <pre id="response">Waiting for request...</pre>

  <script type="module">
    import HttpClient from './http-client.js';
    
    const api = new HttpClient('https://jsonplaceholder.typicode.com');
    const sendButton = document.getElementById('sendButton');
    
    sendButton.addEventListener('click', async () => {
      try {
        const method = document.getElementById('method').value;
        const endpoint = document.getElementById('endpoint').value;
        
        // Parse inputs with error handling
        const parseInput = (id) => {
          const value = document.getElementById(id).value.trim();
          return value ? JSON.parse(value) : {};
        };
        
        const params = parseInput('params');
        const query = parseInput('query');
        const body = ['GET', 'DELETE'].includes(method) ? null : parseInput('body');
        
        document.getElementById('response').textContent = "Sending request...";
        
        const result = await api[method.toLowerCase()](endpoint, { params, query, body });
        document.getElementById('response').textContent = JSON.stringify(result, null, 2);
      } catch (err) {
        document.getElementById('response').textContent = `Error: ${err.message}`;
        console.error(err);
      }
    });
  </script>
</body>
</html>
