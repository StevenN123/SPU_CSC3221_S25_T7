<!DOCTYPE html>
<html>
<head>
  <title>HTTP Library Test</title>
  <style>
    body { font-family: sans-serif; padding: 20px; }
    input, button { padding: 8px; margin: 5px 0; }
    pre { background: #f0f0f0; padding: 10px; }
    .error { color: red; }
  </style>
</head>
<body>
  <h1>HTTP Library Test</h1>
  
  <select id="method">
    <option>GET</option>
    <option>POST</option>
    <option>PUT</option>
    <option>DELETE</option>
  </select>
  
  <input id="endpoint" placeholder="/users/1" value="/users/1">
  <input id="params" placeholder='{"id":1}' value='{"id":1}'>
  <input id="query" placeholder='{"key":"value"}'>
  <textarea id="body" placeholder='{"name":"John"}' rows="3">{"name":"John"}</textarea>
  
  <button onclick="sendRequest()">Send Request</button>
  
  <h3>Response:</h3>
  <pre id="response"></pre>

  <script type="module">
    import HttpClient from './src/http-client.js';
    
    const client = new HttpClient('https://jsonplaceholder.typicode.com');
    
    async function sendRequest() {
      try {
        const method = document.getElementById('method').value;
        const endpoint = document.getElementById('endpoint').value;
        const params = JSON.parse(document.getElementById('params').value || {});
        const query = JSON.parse(document.getElementById('query').value || {});
        const body = JSON.parse(document.getElementById('body').value || null);
        
        const response = await client[method.toLowerCase()](endpoint, { params, query, body });
        document.getElementById('response').textContent = JSON.stringify(response, null, 2);
      } catch (error) {
        document.getElementById('response').textContent = `Error: ${error.message}`;
      }
    }
  </script>
</body>
</html>
